name: Refresh hosted live TV playlist
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_loop_playlist.py'
      - 'scripts/loop_pluto.py'
      - 'scripts/test_build_loop_playlist.py'
      - 'streams/loop-feeds.txt'
      - '.github/workflows/refresh-loop-playlist.yml'
  pull_request:
    paths:
      - 'scripts/build_loop_playlist.py'
      - 'scripts/test_build_loop_playlist.py'
      - 'streams/loop-feeds.txt'
      - '.github/workflows/refresh-loop-playlist.yml'
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: loop-playlist-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run converter tests
        run: python3 -m unittest discover -s scripts -p 'test_build_loop_playlist.py' -v
      - name: Build playlist when feeds are configured
        shell: bash
        run: |
          if grep -Eq '^[[:space:]]*(https://|loop:)' streams/loop-feeds.txt; then
            python3 scripts/build_loop_playlist.py
          else
            echo 'No feeds configured; skipping playlist publication.'
          fi
      - name: Publish only on successful conversion on main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/theloop.m3u
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh hosted live TV playlist"
            git push
          fi
