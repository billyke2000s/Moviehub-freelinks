name: Sports providers sustained playback diagnostic
on:
    push:
        branches: [feature/standalone-provider-engine]
        paths:
            [
                "provider-engine/tools/dlhd-playback.mjs",
                "android-tv-launcher/tests/ProviderRelayProbe.java",
                "android-tv-launcher/app/src/main/java/local/tv/home/ProviderRelay.java",
                "android-tv-launcher/app/src/main/java/local/tv/home/PlaylistSession.java",
                "provider-engine/tools/freeshot.js",
                ".github/workflows/dlhd-playback.yml",
            ]
    workflow_dispatch:
permissions:
    contents: read
jobs:
    playback:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: "22"
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "17"
            - name: Install decoder and pinned interpreter dependencies
              run: |
                  sudo apt-get update -q
                  sudo apt-get install -y -q ffmpeg
                  curl --fail --location --output "$RUNNER_TEMP/rhino.jar" https://repo.maven.apache.org/maven2/org/mozilla/rhino/1.9.1/rhino-1.9.1.jar
                  echo "12dbb224cea124a5d32968722e8eb161c967bf15f3c9a795d1b05592b1147975  $RUNNER_TEMP/rhino.jar" | sha256sum --check
                  curl --fail --location --output "$RUNNER_TEMP/json.jar" https://repo.maven.apache.org/maven2/org/json/json/20250517/json-20250517.jar
            - name: Format diagnostic sources and report changes
              run: |
                  npm install --no-save prettier@3 prettier-plugin-java
                  npx prettier --write android-tv-launcher/tests/ProviderRelayProbe.java provider-engine/tools/dlhd-playback.mjs provider-engine/tools/live-probe.mjs
                  git diff --exit-code
            - name: Compile production interpreter and relay
              run: |
                  mkdir -p build/provider-tests
                  javac -cp "$RUNNER_TEMP/rhino.jar:$RUNNER_TEMP/json.jar" -d build/provider-tests android-tv-launcher/app/src/main/java/local/tv/home/{ProviderScript,ProviderCodec,ProviderSignature,ProviderUrls,ProviderSegments,ProviderRelay,StreamRate,PlaylistSession,ProviderPngSegments,ProviderContainerSegments}.java android-tv-launcher/tests/{ProviderProbeCli,ProviderRelayProbe}.java
            - name: Resolve and decode both tracks for 150 seconds per channel
              run: SPORTS_PROBE_ONLY=freeshot RHINO_JAR="$RUNNER_TEMP/rhino.jar" JSON_JAR="$RUNNER_TEMP/json.jar" node provider-engine/tools/dlhd-playback.mjs
            - name: Upload numerical results only
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: dlhd-playback-diagnostic
                  path: build/provider-tests/dlhd-playback.json
                  if-no-files-found: ignore
